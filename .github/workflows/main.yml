name: Manifold bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python bot.py
        env:
          MANIFOLD_KEY: ${{ secrets.MANIFOLD_KEY }}
      - name: Perp short
        if: always()
        run: python perp_short.py
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_KEY }}
