name: Create market from Kalshi link
on:
  workflow_dispatch:
    inputs:
      kalshi_url:
        description: "Kalshi link"
        required: true
      create:
        description: "Tick to really create it (untick = preview only)"
        type: boolean
        default: false
      max_answers:
        description: "Most answers for multi-answer markets"
        default: "10"
permissions:
  contents: write
concurrency:
  group: markets-file
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python create_market.py
        env:
          MANIFOLD_KEY: ${{ secrets.MANIFOLD_KEY }}
          KALSHI_URL: ${{ inputs.kalshi_url }}
          CREATE: ${{ inputs.create }}
          MAX_ANSWERS: ${{ inputs.max_answers }}
      - name: Save markets.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add markets.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Add market from Kalshi link" && git push; fi
